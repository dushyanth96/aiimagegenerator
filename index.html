<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator | Dushyanth Pragada</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <h1>AI Image Generator</h1>
        </div>
        <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
      </header>
      <div class="main-content">
        <form action="#" class="prompt-form">
          <div class="prompt-container">
            <textarea
              name="prompt area"
              id="prompt-input"
              class="prompt-input"
              placeholder="Describe your imagination in detail..."
              required
              autofocus
            ></textarea>
            <button class="prompt-btn" type="button">
              <i class="fa-solid fa-dice"></i>
            </button>
          </div>
          <div class="prompt-actions">
            <div class="select-wrapper">
              <select class="custom-select" id="model-select" required>
                <option value="" selected disabled>Select AI Model</option>
                <option value="black-forest-labs/FLUX.1-dev">
                  FLUX.1-dev (Best Quality, Slower)
                </option>
                <option value="black-forest-labs/FLUX.1-schnell">
                  FLUX.1-schnell (Fast, Good Quality)
                </option>
              </select>
            </div>
            <div class="select-wrapper">
              <select class="custom-select" id="image-count" required>
                <option value="" selected disabled>Image Count</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>
            <div class="select-wrapper">
              <select class="custom-select" id="aspect-ratio" required>
                <option value="" selected disabled>Aspect Ratio</option>
                <option value="1/1">Square (1:1)</option>
                <option value="16/9">Landscape (16:9)</option>
                <option value="4/3">Portrait (4:3)</option>
                <option value="9/16">Portrait (9:16)</option>
              </select>
            </div>
            <button class="generate-btn" type="submit">
              Generate <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
          </div>
          <!----result gallery grid--->
          <div class="gallery-grid">
            <!-- Images will appear here after generation -->
          </div>
        </form>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
